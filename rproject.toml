[project]
name = "podcasts.jemu.name"
r_version = "4.6.1"

repositories = [
  # Dated P3M snapshot, not `latest`: pins binaries to a point where they exist
  # for every locked version. `latest` drops old binaries over time, forcing
  # source builds under a committed lock. Bump the date deliberately when you
  # want newer packages, then `rv upgrade`.
  { alias = "CRAN", url = "https://packagemanager.posit.co/cran/2026-07-25" },
]

dependencies = [
  "DT",
  "Hmisc",
  "and",
  "base64url",
  "crew",
  "dplyr",
  "forcats",
  "fs",
  "ggbeeswarm",
  "ggplot2",
  "ggrepel",
  "glue",
  "here",
  "hms",
  "hrbrthemes",
  "kableExtra",
  "knitr",
  "lubridate",
  "purrr",
  "qs2",
  "quarto",
  "ragg",
  "reactable",
  "scales",
  "showtext",
  "stringr",
  "sysfonts",
  "tarchetypes",
  "targets",
  "tidyr",
  { name = "poddr", git = "https://github.com/jemus42/poddr", branch = "main" },
]
